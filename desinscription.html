<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Désinscription — Yontech</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="assets/favicon-192.png">
<!-- Page volontairement sans outil de mesure d'audience : elle sert
     uniquement à exercer le droit d'opposition aux messages de prospection. -->
<style>
  :root{--ink:#15161f;--muted:#5b5d72;--line:#e8e8f2;--paper:#f6f6fb;--accent:#4F46E5;--accent-dark:#4338ca;--ok:#17a06a;--danger:#c23b33}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(150deg,#f5f6ff,#f3f4fa);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  main{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:0 24px 70px rgba(21,22,31,.1);text-align:center}
  img{width:64px;height:64px;border-radius:16px;margin:0 auto 18px;display:block}
  h1{font-size:1.45rem;line-height:1.25;letter-spacing:-.01em;margin-bottom:10px}
  p{color:var(--muted)}
  p+p{margin-top:10px}
  button{margin-top:24px;width:100%;padding:13px 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  button:hover{background:var(--accent-dark)}
  button:disabled{opacity:.6;cursor:wait}
  .state{margin-top:18px;font-weight:600}
  .state.ok{color:var(--ok)}
  .state.err{color:var(--danger)}
  .small{font-size:.85rem;margin-top:22px}
  a{color:var(--accent)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <img src="assets/favicon-192.png" alt="Yontech">
  <h1 id="title">Ne plus recevoir nos messages</h1>
  <p id="intro">Confirmez et votre adresse ne recevra plus aucun message de prospection de Yontech.</p>
  <button type="button" id="confirm">Confirmer la désinscription</button>
  <p class="state" id="state" role="status" aria-live="polite"></p>
  <p class="small">Une question sur vos données ? Écrivez-nous depuis <a href="https://yontech.fr" rel="noopener">yontech.fr</a> ou répondez simplement « stop » au message reçu.</p>
</main>
<script>
(function(){
  "use strict";
  // Adresse du projet Supabase qui héberge l'automate (même valeur que dans index.html).
  var ENDPOINT = "__SUPABASE_URL__/functions/v1/yontech-prospection-unsubscribe";
  var token = new URLSearchParams(location.search).get("t") || "";
  var button = document.getElementById("confirm");
  var state = document.getElementById("state");
  var valid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token);

  function show(message, kind){ state.textContent = message; state.className = "state" + (kind ? " " + kind : ""); }

  if (!valid){
    button.hidden = true;
    document.getElementById("intro").textContent = "Ce lien de désinscription est incomplet. Utilisez le lien présent en bas du message reçu, ou répondez simplement « stop » à ce message : nous retirerons votre adresse.";
    return;
  }

  button.addEventListener("click", function(){
    button.disabled = true;
    show("Désinscription en cours…", "");
    fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token }) })
      .then(function(response){ return response.json().catch(function(){ return {}; }).then(function(data){ return { ok: response.ok && data.ok, data: data }; }); })
      .then(function(result){
        if (result.ok){
          button.hidden = true;
          document.getElementById("title").textContent = "C'est fait";
          document.getElementById("intro").textContent = (result.data.email ? result.data.email + " ne recevra" : "Votre adresse ne recevra") + " plus aucun message de prospection de Yontech.";
          show("Désinscription enregistrée.", "ok");
        } else {
          button.disabled = false;
          show((result.data && result.data.error) || "La désinscription n'a pas abouti. Réessayez ou répondez « stop » au message reçu.", "err");
        }
      })
      .catch(function(){
        button.disabled = false;
        show("Connexion impossible. Réessayez dans un instant ou répondez « stop » au message reçu.", "err");
      });
  });
})();
</script>
</body>
</html>
