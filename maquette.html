<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maquette Yontech</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,-apple-system,sans-serif;color:#14161c;background:#f5f6f9}</style>
</head>
<body>
<p id="m">Chargement de la maquette…</p>
<script>
// Lien de secours tant que *.yontech.fr n'est pas branché sur Cloudflare :
// maquette.html?s=<slug> affiche la maquette servie par la fonction publique.
(function(){
  var slug = (new URLSearchParams(location.search).get("s") || "").toLowerCase();
  var msg = document.getElementById("m");
  if (!/^[a-z0-9]([a-z0-9-]{0,48}[a-z0-9])?$/.test(slug)) { msg.textContent = "Maquette introuvable."; return; }
  fetch("https://sdygujqnpsbnmmkjdjfz.supabase.co/functions/v1/yontech-maquette?slug=" + slug)
    .then(function(r){ if (!r.ok) throw new Error(); return r.text(); })
    .then(function(html){ document.open(); document.write(html); document.close(); })
    .catch(function(){ msg.textContent = "Cette maquette n'est plus en ligne."; });
})();
</script>
</body>
</html>
